appId: com.riacore.desktop
productName: RiaCore
asar: false
npmRebuild: false
afterPack: ./scripts/after-pack.cjs
msiProjectCreated: ./scripts/msi-project.cjs
directories:
  app: .release/app
  output: dist-electron
files:
  - '**/*'
  # Portable Git is copied once to Contents/Resources/git below. electron-builder
  # also collects production dependencies from the workspace, so this exclusion is
  # required even though prepare-package.cjs already removes Dugite's bundled copy.
  - '!node_modules/dugite/git'
  - '!node_modules/dugite/git/**/*'
extraResources:
  - from: .release/licenses
    to: licenses
  - from: .release/licenses/RiaCore-LICENSE.txt
    to: LICENSE
  - from: ../../THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: .release/sidecar
    to: node-sidecar
    filter:
      - '**/*'
  - from: .release/git
    to: git
    filter:
      - '**/*'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
msi:
  oneClick: false
  perMachine: true
  runAfterFinish: false
  upgradeCode: 'CF947274-4316-4A6B-B457-DC6CF3E30147'
  additionalWixArgs:
    - -ext
    - WixUtilExtension
win:
  icon: build/icons/win/icon.ico
  target:
    - target: msi
      arch:
        - x64
mac:
  icon: build/icons/mac/icon.icns
  minimumSystemVersion: '26.0.0'
  # Sign the complete app without an Apple certificate, locally and on CI.
  # electron-builder's default entitlements allow JIT and disable library
  # validation so ad-hoc-signed Electron and the Node sidecar can run.
  identity: "-"
  hardenedRuntime: true
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
linux:
  executableName: RiaCore
  icon: build/icons/png
  target:
    - target: AppImage
      arch:
        - x64
